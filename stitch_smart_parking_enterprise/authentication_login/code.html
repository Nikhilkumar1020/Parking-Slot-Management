<style>
        body { font-family: 'Inter', sans-serif; background-color: #f8f9ff; }

<body class="min-h-screen flex items-center justify-center p-md parking-pattern">
<!-- Background Decoration (Visual anchor for Smart Parking Garage) -->
<div class="fixed inset-0 z-0 overflow-hidden pointer-events-none opacity-40">
<div class="w-full h-full bg-cover bg-center" data-alt="A sophisticated, high-end digital illustration of a futuristic underground smart parking garage. The scene features minimalist concrete architecture, glowing blue LED navigational lines on the floor, and sleek, modern electric vehicles neatly parked. Soft, atmospheric lighting creates a professional and reliable enterprise environment, dominated by a corporate blue and clean white palette." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCmj8TecMSKTvP9rFoQK29bZDXvz0rAhAiOAXjz--8sIqlNSH20jnf6IlmvXOLyCgUGRpD4zdPuaBJCGXWdnoJdqEZuUM37DLogJv5y0W5u5Q4zCL8ZACrX5sXyTT-F46ExlDnc7VHIDVYr3HvfRpkMUGvPNxlyJPxNdMbMJzWTEhxHhRdL_K505JuUTStnwpqgM7pS4346vLZ8_2-w2GJsXwC1UXUYnSup8uo2nwEOgLOZmgdjMo0_hPxGeXOYH3ZmfWhAvfkjEQ')"></div>
</div>
<!-- Login Container -->
<main class="relative z-10 w-full max-w-[440px]">
<div class="glass-panel shadow-lg rounded-xl p-xl flex flex-col gap-lg">
<!-- Brand Identity -->
<div class="flex flex-col items-center gap-sm">
<div class="w-12 h-12 bg-primary rounded-lg flex items-center justify-center text-on-primary shadow-sm mb-xs">
<span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 1;">directions_car</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-primary tracking-tight font-extrabold">ParkSystem</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Enterprise Resource Management</p>
</div>
<!-- Login Form -->
<form class="flex flex-col gap-md" onsubmit="event.preventDefault();">
<!-- Email Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-xs" for="email">EMAIL ADDRESS</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">mail</span>
<input class="w-full pl-xl pr-md py-md rounded-lg border border-outline-variant bg-surface focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all font-body-md outline-none" id="email" placeholder="alex.rivera@facility.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-xs">
<div class="flex justify-between items-center ml-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="password">PASSWORD</label>
<a class="font-label-md text-label-md text-primary hover:underline transition-all" href="#">Forgot Password?</a>
</div>
<div class="relative group">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">lock</span>
<input class="w-full pl-xl pr-md py-md rounded-lg border border-outline-variant bg-surface focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all font-body-md outline-none" id="password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Actions -->
<button class="w-full bg-primary text-on-primary py-md rounded-lg font-headline-md text-headline-md hover:bg-on-primary-fixed-variant active:scale-[0.98] transition-all shadow-md mt-sm" type="submit">
                    Login
                </button>
</form>
<!-- Dividers -->
<div class="relative flex items-center py-sm">
<div class="flex-grow border-t border-outline-variant"></div>
<span class="flex-shrink mx-md font-label-md text-label-md text-outline">OR CONTINUE WITH</span>
<div class="flex-grow border-t border-outline-variant"></div>
</div>
<!-- Secondary Options -->
<div class="flex flex-col gap-sm">
<button class="w-full flex items-center justify-center gap-sm bg-surface-container border border-outline-variant py-md rounded-lg font-body-md text-body-md text-on-surface hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined text-[20px]">vpn_key</span>
                    SSO Login
                </button>
<p class="text-center font-body-md text-body-md text-on-surface-variant mt-xs">
                    New to the platform? 
                    <a class="text-primary font-semibold hover:underline" href="#">Register your facility</a>
</p>
</div>
</div>
<!-- Footer / Compliance -->
<footer class="mt-xl text-center flex flex-col gap-xs">
<div class="flex justify-center gap-md font-label-md text-label-md text-outline">
<a class="hover:text-on-surface-variant transition-colors" href="#">Privacy Policy</a>
<span>•</span>
<a class="hover:text-on-surface-variant transition-colors" href="#">Terms of Service</a>
<span>•</span>
<a class="hover:text-on-surface-variant transition-colors" href="#">Support</a>
</div>
<p class="font-label-md text-label-md text-outline-variant opacity-70">© 2024 ParkSystem Global Solutions. All rights reserved.</p>
</footer>
</main>
<!-- Micro-interaction Script -->
<script>
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('scale-[1.01]');
                input.parentElement.style.transition = 'transform 0.2s ease-out';
            });
            input.addEventListener('blur', () => {
                input.parentElement.classList.remove('scale-[1.01]');
            });
        });
    </script>
